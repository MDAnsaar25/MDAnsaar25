<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B18"/>
      <stop offset="55%" stop-color="#0A1930"/>
      <stop offset="100%" stop-color="#0D2748"/>
    </linearGradient>

    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <clipPath id="typeClip">
      <rect x="0" y="0" height="70" width="0">
        <animate attributeName="width" from="0" to="620" dur="1.6s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1" keyTimes="0;1" values="0;620"/>
      </rect>
    </clipPath>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- faint circuit grid -->
  <g stroke="#173257" stroke-width="1" opacity="0.55">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="780" y1="0" x2="780" y2="300"/>
  </g>
  <g fill="#1E4B7A" opacity="0.8">
    <circle cx="780" cy="60" r="3"/>
    <circle cx="780" cy="240" r="3"/>
  </g>

  <!-- terminal prompt block -->
  <g font-family="Consolas, Menlo, Monaco, monospace">
    <text x="70" y="95" font-size="20" fill="#5A6B85">$ whoami</text>

    <g clip-path="url(#typeClip)">
      <text x="70" y="160" font-size="52" font-weight="700" fill="#EDF1F7">Mohamed Ansaar</text>
    </g>
    <!-- blinking cursor -->
    <rect x="696" y="120" width="14" height="42" fill="#22D3EE" opacity="0">
      <animate id="curIn" attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.6s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1s" begin="curIn.end" repeatCount="indefinite"/>
    </rect>

    <text x="70" y="200" font-size="19" fill="#9AA7BD" opacity="0">
      Building with LLMs · Transformers · Agentic AI
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.3s" fill="freeze"/>
    </text>

    <text x="70" y="235" font-size="15" fill="#5A6B85" opacity="0">
      Open to collaborating on data science &amp; ML projects
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.7s" fill="freeze"/>
    </text>
  </g>

  <!-- neural network motif, drawn once then gently breathing -->
  <g transform="translate(870,60)">
    <g stroke="#2B6CB0" stroke-width="1.5" fill="none" opacity="0.9">
      <path d="M20,40 L110,20" stroke-dasharray="120" stroke-dashoffset="120">
        <animate attributeName="stroke-dashoffset" from="120" to="0" dur="0.9s" begin="0.6s" fill="freeze"/>
      </path>
      <path d="M20,40 L100,100" stroke-dasharray="110" stroke-dashoffset="110">
        <animate attributeName="stroke-dashoffset" from="110" to="0" dur="0.9s" begin="0.8s" fill="freeze"/>
      </path>
      <path d="M110,20 L200,60" stroke-dasharray="110" stroke-dashoffset="110">
        <animate attributeName="stroke-dashoffset" from="110" to="0" dur="0.9s" begin="1.0s" fill="freeze"/>
      </path>
      <path d="M100,100 L200,60" stroke-dasharray="110" stroke-dashoffset="110">
        <animate attributeName="stroke-dashoffset" from="110" to="0" dur="0.9s" begin="1.1s" fill="freeze"/>
      </path>
      <path d="M100,100 L190,150" stroke-dasharray="110" stroke-dashoffset="110">
        <animate attributeName="stroke-dashoffset" from="110" to="0" dur="0.9s" begin="1.2s" fill="freeze"/>
      </path>
      <path d="M200,60 L280,90" stroke-dasharray="90" stroke-dashoffset="90">
        <animate attributeName="stroke-dashoffset" from="90" to="0" dur="0.7s" begin="1.4s" fill="freeze"/>
      </path>
      <path d="M190,150 L280,90" stroke-dasharray="90" stroke-dashoffset="90">
        <animate attributeName="stroke-dashoffset" from="90" to="0" dur="0.7s" begin="1.5s" fill="freeze"/>
      </path>
    </g>

    <g fill="url(#nodeGlow)" filter="url(#softGlow)">
      <circle cx="20" cy="40" r="0" >
        <animate attributeName="r" from="0" to="6" dur="0.3s" begin="0.4s" fill="freeze"/>
      </circle>
      <circle cx="110" cy="20" r="0">
        <animate attributeName="r" from="0" to="5" dur="0.3s" begin="1.3s" fill="freeze"/>
      </circle>
      <circle cx="100" cy="100" r="0">
        <animate attributeName="r" from="0" to="5" dur="0.3s" begin="1.5s" fill="freeze"/>
      </circle>
      <circle cx="200" cy="60" r="0">
        <animate attributeName="r" from="0" to="6" dur="0.3s" begin="1.9s" fill="freeze"/>
      </circle>
      <circle cx="190" cy="150" r="0">
        <animate attributeName="r" from="0" to="5" dur="0.3s" begin="2.0s" fill="freeze"/>
      </circle>
      <circle cx="280" cy="90" r="0" fill="#22D3EE">
        <animate attributeName="r" from="0" to="7" dur="0.35s" begin="2.2s" fill="freeze"/>
        <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" begin="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
